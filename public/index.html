<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Nomrank</title>
    <meta name="theme-color" content="#17111c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nomrank" />
    <link rel="apple-touch-icon" href="/app/app-icon.png" />
    <link rel="icon" href="/app/app-icon.png" />
    <link rel="manifest" href="/app/manifest.json" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #17111c;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      html {
        touch-action: pan-x pan-y;
      }
      input,
      textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Nomrank.</noscript>
    <div id="root"></div>
  </body>
</html>
